<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CR7 Challenge</title><style>*{box-sizing:border-box}body{margin:0;background:#071722;color:white;font-family:system-ui;text-align:center}header{padding:10px;font-size:24px;font-weight:900;color:#ffcd58}#wrap{position:relative;width:min(100vw - 16px,480px);aspect-ratio:2/3;max-height:calc(100dvh - 120px);margin:auto;border:2px solid #527d88;border-radius:20px;overflow:hidden;background:#217b52}canvas{width:100%;height:100%;display:block;touch-action:none}#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:#051d2ab9}#overlay:empty{pointer-events:none;background:none}h1{font-size:39px;margin:5px;color:#ffd26c;text-shadow:2px 3px #102c3b}h2{margin:8px}p{line-height:1.5;font-size:15px}button{font:700 17px system-ui;color:white;background:#153d4e;border:1px solid #8bb0bd;border-radius:12px;padding:12px;min-height:50px;cursor:pointer}button:active{transform:scale(.96)}.gold{background:#eebd4a;color:#14262c;border:0}.menuButton{width:100%;max-width:340px}#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:1px 2px #000}#controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:12px}#controls button{min-width:75px;background:#062938df}#controls #act{flex:1;background:#ffd26c;color:#10232b}.panel{width:100%;background:#082b3dea;padding:22px;border:1px solid #9ec3c9;border-radius:20px}#pause{position:absolute;top:42px;right:12px;font-size:12px;min-height:32px;padding:5px 10px}footer{padding:10px;font-size:10px;color:#b4c9ce} [hidden]{display:none!important}</style></head><body><header>CR7 CHALLENGE</header><div id="wrap"><canvas id="c" width="480" height="720"></canvas><div id="hud" hidden><span id="score"></span><span id="info"></span></div><button id="pause" hidden>Pause</button><div id="overlay"></div><div id="controls" hidden><button id="left">◀</button><button id="act">SCHUSS</button><button id="right">▶</button></div></div><footer>DEIN MOMENT · DEIN STADION · DEINE CHALLENGE</footer><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d'),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let mode='menu',game=null,paused=false,last=0,clock=0,held=0,sequence=null;const lanes=[110,240,370];
function background(t){let grad=g.createLinearGradient(0,0,0,720);grad.addColorStop(0,'#10273c');grad.addColorStop(.34,'#294e5c');grad.addColorStop(.35,'#22784d');grad.addColorStop(1,'#2d985b');g.fillStyle=grad;g.fillRect(0,0,480,720);for(let i=0;i<7;i++){g.fillStyle=i%2?'#ffffff08':'#00000009';g.fillRect(0,260+i*75,480,75)}g.fillStyle='#142b3c';g.fillRect(0,75,480,125);for(let i=0;i<130;i++){g.fillStyle=['#e6bb73','#b6d3d9','#cf5663'][i%3];g.fillRect((i*43)%480,82+((i*17)%106),4,6)}g.strokeStyle='#d2edcd88';g.lineWidth=3;g.beginPath();g.moveTo(60,720);g.lineTo(145,260);g.moveTo(420,720);g.lineTo(335,260);g.stroke()}
function ellipse(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}
function person(x,y,s=1,type='hero',t=0){g.save();g.translate(x,y);g.scale(s,s);let kit=type==='hero'?'#df3042':type==='boss'?'#a8dbe8':type==='keeper'?'#ffbf3f':'#3964b1',step=Math.sin(t*11)*8;ellipse(0,1,32,8,'#002c2a66');g.fillStyle='#e9a06b';g.fillRect(-18,-56+step,13,42);g.fillRect(5,-56-step,13,42);g.fillStyle='#eee';g.fillRect(-20,-18+step,17,12);g.fillRect(4,-18-step,17,12);g.fillStyle=kit;g.fillRect(-25,-108,50,55);g.fillStyle='#e9a06b';g.fillRect(-34,-100,10,37);g.fillRect(24,-100,10,37);ellipse(0,-134,27,31,'#f1ad7b');ellipse(0,-161,25,14,'#22262c');ellipse(-11,-138,4,5,'white');ellipse(11,-138,4,5,'white');ellipse(-11,-138,2,3,'#1b242c');ellipse(11,-138,2,3,'#1b242c');g.strokeStyle='#553a35';g.lineWidth=2;g.beginPath();g.arc(0,-125,10,.2,Math.PI-.2);g.stroke();g.fillStyle='white';g.textAlign='center';g.font='bold 22px system-ui';g.fillText(type==='hero'?'7':type==='boss'?'10':'',0,-73);g.restore()}
function ball(x,y,r=16){ellipse(x,y,r,r,'#fff5e4');ellipse(x,y,r*.45,r*.45,'#152d38');for(let a=0;a<5;a++){let q=a*Math.PI*2/5;ellipse(x+Math.cos(q)*r*.76,y+Math.sin(q)*r*.76,r*.2,r*.2,'#152d38')}}
function goal(){g.fillStyle='#08253eaa';g.fillRect(65,125,350,210);g.strokeStyle='white';g.lineWidth=6;g.strokeRect(65,125,350,210);g.lineWidth=1;g.strokeStyle='#ffffff66';for(let x=85;x<415;x+=22){g.beginPath();g.moveTo(x,125);g.lineTo(x,335);g.stroke()}for(let y=145;y<335;y+=22){g.beginPath();g.moveTo(65,y);g.lineTo(415,y);g.stroke()}}
function text(s,x,y,size=20){g.fillStyle='white';g.textAlign='center';g.font=`900 ${size}px system-ui`;g.fillText(s,x,y)}
function show(html){$('overlay').innerHTML=html}function menu(){mode='menu';game=null;paused=false;sequence=null;$('hud').hidden=$('controls').hidden=$('pause').hidden=true;show('<h1>⚽ CR7 CHALLENGE</h1><p>Drei Challenges. Eine Legende.</p><button class="menuButton" data-mode="dribble">⚡ Dribbel-Challenge</button><button class="menuButton" data-mode="headers">⚽ Kopfball-Challenge</button><button class="menuButton" data-mode="free">🎯 Freistoß-Challenge</button>')}
const help={dribble:'Wechsle zwischen drei Spuren. Immer nur eine ist frei. Nach 30 Gegnerwellen kommt der besondere Endgegner und anschließend die Tor-Challenge.',headers:'Bewege Ronaldo nach links und rechts. Halte den Ball durch Kopfbälle in der Luft. Du hast drei Leben.',free:'Stoppe zuerst den Richtungszeiger, dann den Höhenzeiger. Zehn Freistöße warten auf dich.'};function intro(m){mode='intro';show(`<div class="panel"><h2>${({dribble:'Dribbel-Challenge',headers:'Kopfball-Challenge',free:'Freistoß-Challenge'})[m]}</h2><p>${help[m]}</p><button class="gold" data-start="${m}">Los geht’s!</button><p><button data-home>Hauptmenü</button></p></div>`)}
function start(m){mode=m;paused=false;sequence=null;game=m==='dribble'?{lane:1,x:240,waves:[],passed:0,spawn:.5,score:0}:m==='headers'?{x:240,ball:{x:170,y:180,vx:40,vy:80},score:0,lives:3,hits:0}:{phase:0,t:0,dir:0,height:0,shots:0,goals:0,score:0,keeper:240,flight:0,result:null};$('hud').hidden=$('controls').hidden=$('pause').hidden=false;$('left').hidden=$('right').hidden=m==='free';$('act').hidden=m!=='free';show('')}
function finish(title,desc,win=false){if(mode==='result')return;let points=game.score,old=mode;mode='result';$('controls').hidden=$('pause').hidden=true;show(`<div class="panel"><h2>${win?'🏆 ':''}${title}</h2><p>${desc}</p><h1>${points} Punkte</h1><button class="gold" data-start="${old}">Noch eine Runde</button><p><button data-home>Hauptmenü</button></p></div>`)}
function move(d){if(paused||!game||sequence)return;if(mode==='dribble')game.lane=clamp(game.lane+d,0,2);if(mode==='headers')game.x=clamp(game.x+d*40,35,445)}function action(){if(paused||mode!=='free')return;let f=game;if(f.phase===0){f.dir=Math.sin(f.t*2.6);f.phase=1}else if(f.phase===1){f.height=(Math.sin(f.t*3.3)+1)/2;f.shots++;let x=240+f.dir*180,y=325-f.height*190;f.result={x,y,goal:x>80&&x<400&&y>140&&y<327&&Math.abs(x-f.keeper)>65};f.flight=0;f.phase=2}else if(f.phase===3){if(f.shots>=10)finish('Abpfiff!',`${f.goals} Tore bei zehn Schüssen.`,f.goals>=5);else f.phase=0}}
function startSequence(){sequence={seq:Array.from({length:4},()=>Math.floor(Math.random()*4)),index:0,time:9,shot:0};renderSequence()}function renderSequence(){let a=['←','↑','→','↓'];show(`<div class="panel"><h2>⚽ TORABSCHLUSS</h2><p>Tippe die Pfeile der Reihe nach!<br><b id="timer"></b></p><div style="display:flex;justify-content:center;gap:6px">${sequence.seq.map((v,i)=>`<button data-seq="${i}" style="padding:8px;background:${i<sequence.index?'#26865b':i===sequence.index?'#eebd4a':'#153d4e'}">${a[v]}</button>`).join('')}</div></div>`)}function seqTap(i){if(!sequence||sequence.shot)return;if(i!==sequence.index){sequence.time-=1;return}sequence.index++;if(sequence.index===4){sequence.shot=.001;show('')}else renderSequence()}
$('overlay').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.mode)intro(b.dataset.mode);else if(b.dataset.start)start(b.dataset.start);else if(b.hasAttribute('data-home'))menu();else if(b.dataset.seq!==undefined)seqTap(+b.dataset.seq);else if(b.hasAttribute('data-resume'))togglePause()};function togglePause(){if(!game||mode==='result')return;paused=!paused;if(paused)show('<div class="panel"><h2>Pause</h2><button data-resume>Weiter</button><p><button data-home>Hauptmenü</button></p></div>');else if(sequence&&!sequence.shot)renderSequence();else show('')}$('pause').onclick=togglePause;
for(let [id,d] of [['left',-1],['right',1]]){$(id).onpointerdown=e=>{e.preventDefault();move(d);held=d;$(id).setPointerCapture(e.pointerId)};$(id).onpointerup=$(id).onpointercancel=()=>held=0}$('act').onclick=action;let down=null;c.onpointerdown=e=>{down={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)};c.onpointerup=e=>{if(!down||paused)return;let rect=c.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*480;if(mode==='dribble')move(e.clientX<down.x-25?-1:e.clientX>down.x+25?1:x<240?-1:1);if(mode==='headers')game.x=clamp(x,35,445);if(mode==='free')action();down=null};window.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(e.key))e.preventDefault();if(e.repeat)return;if(sequence&&!sequence.shot){let n=['ArrowLeft','ArrowUp','ArrowRight','ArrowDown'].indexOf(e.key);if(n>=0)seqTap(n===sequence.seq[sequence.index]?sequence.index:-1);return}if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key===' '||e.key==='Enter')action();if(e.key==='Escape')togglePause()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&game&&!paused&&mode!=='result')togglePause()});
function update(dt){if(!game||paused||mode==='result')return;let f=game;if(mode==='dribble'){f.x+=(lanes[f.lane]-f.x)*Math.min(1,dt*15);if(!sequence){f.spawn-=dt;let speed=160+Math.min(f.passed,25)*4;if(f.spawn<=0&&f.passed+f.waves.length<31){f.waves.push({y:70,free:Math.floor(Math.random()*3),boss:f.passed+f.waves.length===30});f.spawn=1.5+Math.random()*.3}for(let w of f.waves){w.y+=speed*dt;if(w.y>=550&&!w.checked){w.checked=true;if(Math.abs(f.x-lanes[w.free])>48){finish('Abgefangen!',`${f.passed} Gegnerwellen geschafft.`);return}f.passed++;f.score+=w.boss?300:100}}f.waves=f.waves.filter(w=>w.y<760);if(f.passed===31)startSequence()}else if(!sequence.shot){sequence.time-=dt;if($('timer'))$('timer').textContent=`Noch ${Math.max(0,sequence.time).toFixed(1)} Sekunden`;if(sequence.time<=0)finish('Zeit abgelaufen','Versuche den Torabschluss erneut.')}else{sequence.shot+=dt;if(sequence.shot>1.5){f.score+=500;finish('SIUUU!','Alle Gegner ausgespielt und das Tor getroffen!',true)}}}}else if(mode==='headers'){f.x=clamp(f.x+held*330*dt,35,445);let b=f.ball;b.vy+=(175+f.hits*3)*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<20||b.x>460)b.vx*=-1;if(b.vy>0&&b.y>=554&&b.y<590&&Math.abs(b.x-f.x)<49){b.y=553;b.vy=-370;b.vx=(b.x-f.x)*2+(Math.random()-.5)*160;f.hits++;f.score+=100}if(b.y>690){f.lives--;if(!f.lives)finish('Training beendet',`${f.hits} Kopfbälle geschafft!`);else f.ball={x:50+Math.random()*380,y:110,vx:0,vy:90}}}else if(mode==='free'){f.t+=dt;f.keeper=240+Math.sin(f.t*1.4)*95;if(f.phase===2){f.flight+=dt;if(f.flight>=1){if(f.result.goal){f.goals++;f.score+=100}f.phase=3;if(f.shots>=10)finish('Abpfiff!',`${f.goals} von zehn Freistößen verwandelt!`,f.goals>=5)}}}}
function render(){background(clock);if(mode==='menu'||mode==='intro'){person(240,465,1.55,'hero',clock);ball(320,480,23)}else if(mode==='dribble'||mode==='result'&&game?.waves){if(sequence){goal();person(240,650,1,'hero',clock);person(240,330,.7,'keeper',clock);ball(270-(sequence.shot?Math.min(1,sequence.shot)*120:0),640-(sequence.shot?Math.min(1,sequence.shot)*440:0))}else{for(let w of game.waves)for(let j=0;j<3;j++)if(j!==w.free)person(lanes[j],w.y,.7,w.boss?'boss':'defender',clock);person(game.x,665,1,'hero',clock);ball(game.x+27,680);text(`${game.passed}/31`,240,65,22)}}else if(mode==='headers'||mode==='result'&&game?.ball){person(game.x,710,1,'hero',clock);ball(game.ball.x,game.ball.y)}else if(mode==='free'||mode==='result'&&game?.phase!==undefined){goal();let f=game;person(f.keeper,335,.75,'keeper',clock);person(190,640,1.15,'hero',clock);let x=265,y=635;if(f.result&&f.phase>=2){let k=Math.min(1,f.flight);x+=(f.result.x-x)*k;y+=(f.result.y-y)*k}ball(x,y,16);if(f.phase<2){let value=f.phase===0?(Math.sin(f.t*2.6)+1)/2:(Math.sin(f.t*3.3)+1)/2;g.fillStyle='#102f3f';g.fillRect(65,465,350,22);g.fillStyle='#4bcda0';g.fillRect(90,465,65,22);g.fillRect(325,465,65,22);g.fillStyle='#ffcf55';g.fillRect(65+350*value-5,460,10,32);text(f.phase===0?'RICHTUNG':'HÖHE',240,445)}if(f.phase===3)text(f.result.goal?'TOOOR!':'KNAPP DANEBEN!',240,400)}if(game&&mode!=='result'){$('score').textContent=game.score+' Punkte';$('info').textContent=mode==='dribble'?game.passed+'/31':mode==='headers'?'♥'.repeat(game.lives):'Schuss '+Math.min(10,game.shots+1)+'/10';if(mode==='free')$('act').textContent=['Richtung stoppen','Höhe stoppen','Schuss läuft …','Weiter →'][game.phase]}}
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(!paused){clock+=dt;update(dt)}render();requestAnimationFrame(frame)}menu();requestAnimationFrame(frame);
</script></body></html>
