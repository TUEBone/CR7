<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071c29">
  <title>CR7 Challenge · Dein Weg zum GOAT</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="app">
  <header>
    <a href="#" id="home" aria-label="Zum Hauptmenü">CR<span>7</span><small>CHALLENGE</small></a>
    <div><button id="save" aria-label="Spielstand speichern oder laden">Speichern</button><button id="sound" aria-label="Ton einschalten" aria-pressed="false">Ton aus</button><button id="pause" hidden>Pause</button></div>
  </header>
  <section id="stage" aria-label="CR7 Challenge">
    <canvas id="game" width="480" height="720" aria-label="Fußballspielfeld"></canvas>
    <div id="hud" hidden><span id="score"></span><span id="detail"></span></div>
    <div id="overlay"><div class="card"><div class="eyebrow">WILLKOMMEN IM STADION</div><h1>CR7 <span>CHALLENGE</span></h1><p>Grafiken werden geladen …</p></div></div>
    <div id="controls" hidden><button id="left" aria-label="Nach links">◀</button><button id="action">Bestätigen</button><button id="right" aria-label="Nach rechts">▶</button></div>
  </section>
  <footer>DEIN MOMENT. DEIN STADION. <b>DEINE KARRIERE.</b></footer>
  <p id="storage-note" class="storage-note" hidden>Automatisches Speichern ist hier nicht verfügbar. Sichere deinen Fortschritt über „Speichern“ als Code.</p>
  <div id="announce" class="sr-only" aria-live="polite"></div>
</main>
<script type="module" src="./js/app.js"></script>
</body>
</html>
