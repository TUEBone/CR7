class Dribble {
 constructor(random=Math.random){this.random=random;this.lane=1;this.x=240;this.waves=[];this.passed=0;this.timer=.8;this.done=false;this.failed=false;this.score=0;this.boss=false;}

 if(this.timer<=0&&this.passed+this.waves.length<18){const index=this.passed+this.waves.length;this.waves.push({y:90,free:Math.floor(this.random()*3),checked:false,boss:index>=15});this.timer=index>=15?1.35:1.65+this.random()*.3;}
 for(const w of this.waves){w.y+=speed*(w.boss?1.15:1)*dt;if(!w.checked&&w.y>=553){w.checked=true;if(Math.abs(this.x-[110,240,370][w.free])>48){this.failed=true;return;}this.passed++;this.score+=w.boss?150:100;this.boss=this.passed>=15;}}
 this.waves=this.waves.filter(w=>w.y<760);if(this.passed>=18)this.done=true;
 }
}
class Headers{
 constructor(random=Math.random){this.random=random;this.x=240;this.target=240;this.score=0;this.hits=0;this.lives=3;this.failed=false;this.reset();}
 reset(){this.ball={x:80+this.random()*320,y:130,vx:0,vy:90};this.cooldown=0;}
 move(d,dt){this.target=clamp(this.target+d*340*dt,42,438);}
 update(dt){if(this.failed)return;this.x+=(this.target-this.x)*Math.min(1,dt*18);const b=this.ball;this.cooldown=Math.max(0,this.cooldown-dt);const old=b.y;b.vy+=(180+Math.min(this.hits,25)*5)*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<22||b.x>458){b.x=clamp(b.x,22,458);b.vx*=-1;}
 if(b.vy>0&&old<=554&&b.y>=554&&Math.abs(b.x-this.x)<45&&this.cooldown===0){b.y=553;b.vy=-360-Math.min(this.hits,20)*3;b.vx=clamp((b.x-this.x)*3+(this.random()-.5)*100,-180,180);this.hits++;this.score+=100;this.cooldown=.25;}

}
function resolveShot(direction,height,keeper){const x=240+direction*180,y=330-height*190;const onTarget=x>79&&x<401&&y>145&&y<327;const distance=Math.hypot(x-keeper,(y-265)*.65);const goal=onTarget&&distance>65;const precision=onTarget&&Math.abs(direction)>.55&&height>.55;return{x,y,goal,precision,points:goal?(precision?150:100):0};}
class FreeKick{
 constructor(){this.score=0;this.shots=0;this.goals=0;this.phase='direction';this.time=0;this.direction=0;this.height=0;this.flight=0;this.message='Richtung festlegen';}

 tap(){if(this.phase==='direction'){this.direction=Math.sin(this.time*2);this.phase='height';this.message='Jetzt die Höhe!';}else if(this.phase==='height'){this.height=(Math.sin(this.time*2.7)+1)/2;this.result=resolveShot(this.direction,this.height,this.keeper);this.keeperStart=this.keeper;this.phase='flight';this.flight=0;this.shots++;}else if(this.phase==='result'&&this.shots<10){this.phase='direction';this.message='Richtung festlegen';}}
 update(dt){this.time+=dt;if(this.phase==='flight'){this.flight+=dt;if(this.flight>=1){this.score+=this.result.points;if(this.result.goal)this.goals++;this.message=this.result.goal?(this.result.precision?'Traumtor! +150':'Tooor! +100'):'Gehalten oder vorbei!';this.phase='result';}}}
}
class Renderer{

 stadium(t,scroll=0){const c=this.c;c.clearRect(0,0,480,720);const sky=c.createLinearGradient(0,0,0,260);sky.addColorStop(0,'#091827');sky.addColorStop(1,'#315469');c.fillStyle=sky;c.fillRect(0,0,480,720);c.fillStyle='#172a3a';c.beginPath();c.moveTo(0,70);c.quadraticCurveTo(240,175,480,70);c.lineTo(480,255);c.lineTo(0,255);c.fill();
 for(let row=0;row<5;row++)for(let col=0;col<35;col++){const x=col*15+(row%2)*7,y=118+row*24+Math.sin(col*.16)*14;c.fillStyle=['#e3be7d','#6a9da9','#d75d63','#c6d5cb'][(col*7+row*3)%4];c.globalAlpha=.45+.2*Math.sin(t+col);c.fillRect(x,y,5,7);}c.globalAlpha=1;
 for(const x of [20,460]){const glow=c.createRadialGradient(x,55,2,x,55,150);glow.addColorStop(0,'#e6faff99');glow.addColorStop(1,'#e6faff00');c.fillStyle=glow;c.fillRect(0,0,480,250);c.fillStyle='#e4f7ff';for(let j=0;j<4;j++)c.fillRect(x-15+(j%2)*18,35+Math.floor(j/2)*17,13,11);}
 c.fillStyle='#24865a';c.fillRect(0,255,480,465);for(let i=0;i<9;i++){c.fillStyle=i%2?'#2b915e':'#268759';c.fillRect(0,255+((i*75+scroll)%675)-75,480,75);}c.strokeStyle='#d2e9bc66';c.lineWidth=3;c.beginPath();c.moveTo(36,720);c.lineTo(120,255);c.lineTo(360,255);c.lineTo(444,720);c.stroke();c.beginPath();c.ellipse(240,430,120,35,0,0,Math.PI*2);c.stroke();}
 player(x,y,s=1,t=0,kind='hero',pose='run'){const c=this.c;c.save();c.translate(x,y);c.scale(s,s);const run=pose==='run'?Math.sin(t*12):0;const jump=pose==='jump'?-12*Math.abs(Math.sin(t*6)):0;c.translate(0,jump);c.globalAlpha=.23;c.fillStyle='#001b20';c.beginPath();c.ellipse(0,4,35,9,0,0,7);c.fill();c.globalAlpha=1;const kit=kind==='hero'?'#dc263c':kind==='boss'?'#a8dfee':kind==='keeper'?'#ffbd3e':'#3863ad';
 for(const side of [-1,1]){c.save();c.translate(side*14,-45);c.rotate(side*run*.35);this.path([[-9,0],[9,0],[8,33],[-8,33]],'#e9a16b');this.path([[-9,20],[9,20],[9,40],[-9,40]],kind==='hero'?'#176749':kit);this.ellipse(2,44,15,7,'#f7f4e8');c.restore();}
 this.path([[-25,-66],[25,-66],[22,-37],[1,-37],[0,-47],[-1,-37],[-22,-37]],kind==='hero'?'#af2032':'#172d46');
 this.path([[-23,-113],[-35,-102],[-25,-87],[-20,-91],[-23,-64],[23,-64],[20,-91],[25,-87],[35,-102],[23,-113],[10,-119],[-10,-119]],kit);
 for(const side of [-1,1]){c.save();c.translate(side*29,-98);c.rotate(side*run*.45);this.ellipse(0,12,8,19,'#f0ae76');this.ellipse(0,26,9,9,'#f7b984');c.restore();}
 this.path([[-11,-119],[0,-110],[11,-119]],'#f2b27b');this.text(kind==='hero'?'7':kind==='boss'?'10':'',0,-78,22);
 this.ellipse(0,-140,27,32,'#f4b17c');this.ellipse(-27,-139,4,8,'#e8a16c');this.ellipse(27,-139,4,8,'#e8a16c');
 this.path([[-25,-145],[-27,-161],[-18,-170],[-25,-171],[-6,-179],[11,-177],[6,-182],[25,-170],[28,-151],[18,-157],[13,-165],[-3,-158],[-14,-160]],'#202129');
 c.strokeStyle='#69615a';c.lineWidth=2;for(let i=0;i<4;i++){c.beginPath();c.moveTo(-18+i*7,-166);c.quadraticCurveTo(-4+i*6,-178,18,-168+i*2);c.stroke();}c.strokeStyle='#ffffff45';c.lineWidth=3;c.beginPath();c.moveTo(-17,-104);c.lineTo(-14,-71);c.stroke();this.ellipse(13,-100,3,4,'#e8c36a');c.strokeStyle='#171c24';c.lineWidth=4;c.beginPath();c.moveTo(-18,-147);c.lineTo(-7,-150);c.moveTo(7,-150);c.lineTo(18,-147);c.stroke();this.ellipse(-12,-140,4,5,'#fff');this.ellipse(12,-140,4,5,'#fff');this.ellipse(-11,-140,1.5,2.5,'#302522');this.ellipse(11,-140,1.5,2.5,'#302522');c.strokeStyle='#b47652';c.lineWidth=2;c.beginPath();c.moveTo(0,-139);c.lineTo(-3,-129);c.lineTo(3,-129);c.stroke();this.path([[-12,-122],[12,-122],[7,-115],[-6,-115]],'#fff');c.restore();}
 ball(x,y,r=15,spin=0){const c=this.c;c.save();c.translate(x,y);c.rotate(spin);this.ellipse(0,0,r,r,'#fff6de');let p=[];for(let i=0;i<5;i++)p.push([Math.cos(i*Math.PI*2/5)*r*.44,Math.sin(i*Math.PI*2/5)*r*.44]);this.path(p,'#182936');for(let i=0;i<5;i++){c.rotate(Math.PI*2/5);c.strokeStyle='#182936';c.lineWidth=2;c.beginPath();c.moveTo(r*.43,0);c.lineTo(r*.91,0);c.stroke();}c.restore();}
 goal(){const c=this.c;c.fillStyle='#0a253d99';c.fillRect(72,144,336,185);c.strokeStyle='#dcebf0';c.lineWidth=7;c.strokeRect(72,144,336,185);c.lineWidth=1;c.strokeStyle='#dcebf055';for(let x=72;x<408;x+=21){c.beginPath();c.moveTo(x,144);c.lineTo(x,329);c.stroke();}for(let y=144;y<329;y+=20){c.beginPath();c.moveTo(72,y);c.lineTo(408,y);c.stroke();}}
 meter(y,value,label){const c=this.c;if(label.startsWith('HÖHE')){this.text('HÖHE',420,400,13);c.fillStyle='#092333';c.fillRect(410,415,20,145);c.fillStyle='#48cd9a';c.fillRect(410,425,20,40);c.fillStyle='#ffda72';c.fillRect(405,555-clamp(value,0,1)*135,30,7);return;}this.text(label,240,y-16,16);c.fillStyle='#092333';c.fillRect(65,y,350,20);c.fillStyle='#48cd9a';c.fillRect(85,y,55,20);c.fillRect(340,y,55,20);c.fillStyle='#ffda72';c.fillRect(65+clamp(value,0,1)*350-4,y-4,8,28);}

const $=id=>document.getElementById(id),r=new Renderer($('game'));let mode='menu',model=null,paused=false,time=0,last=0,keys=new Set(),endShown=false,finish=null,muted=true,audio;
const names={dribble:'Dribbel-Challenge',headers:'Kopfball-Challenge',free:'Freistoß-Challenge'};
const instructions={dribble:'Wechsle mit Tippen auf die Bildschirmhälften, Wischen oder den Pfeiltasten die Spur. Zwei Verteidiger, ein freier Weg! Nach 15 Wellen wartet ein besonderer Gegner mit drei schnellen Ausweichmanövern. Danach: die Tippfolge zum Tor.',headers:'Halte die Pfeilflächen gedrückt oder nutze die Pfeiltasten. Stell dich unter den fallenden Ball: Ronaldo köpft automatisch. Jeder Kopfball zählt 100 Punkte. Du hast drei Leben.',free:'Tippe oder drücke Leertaste zweimal: erst für die Richtung, dann für die Höhe. Ziele in die oberen Ecken und beobachte den Torwart. Zehn Schüsse, bis zu 150 Punkte pro Tor.'};
function tone(win=true){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.setValueAtTime(win?660:180,audio.currentTime);o.frequency.exponentialRampToValueAtTime(win?990:80,audio.currentTime+.15);g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);o.start();o.stop(audio.currentTime+.25);}catch{}}
function overlay(html,cls=''){$('overlay').className=cls;$('overlay').innerHTML=html;}
function menu(){mode='menu';model=null;finish=null;paused=false;keys.clear();$('hud').hidden=true;$('controls').hidden=true;$('pause').hidden=true;overlay(`<div class="hero-title"><div class="eyebrow">DAS STADION GEHÖRT DIR</div><h1>CR7 <span>CHALLENGE</span></h1><p>Drei Challenges. Eine Legende. Dein Highscore.</p></div><div class="modes"><button class="mode" data-mode="dribble"><i>⚡</i><span><strong>Dribbel-Challenge</strong><small>Finde die Lücke. Zieh an allen vorbei.</small></span><em>→</em></button><button class="mode" data-mode="headers"><i>⚽</i><span><strong>Kopfball-Challenge</strong><small>Halte den Ball in der Luft.</small></span><em>→</em></button><button class="mode" data-mode="free"><i>🎯</i><span><strong>Freistoß-Challenge</strong><small>Ziele. Schieße. Triff den Winkel.</small></span><em>→</em></button></div>`,'menu');}
function intro(m){mode='intro';overlay(`<div class="card"><div class="eyebrow">BEREIT FÜR DEINEN MOMENT?</div><h2>${names[m]}</h2><p>${instructions[m]}</p><button class="primary" data-start="${m}">Los geht’s →</button><button data-home>Hauptmenü</button></div>`);}
function start(m){mode=m;model=m==='dribble'?new Dribble():m==='headers'?new Headers():new FreeKick();paused=false;endShown=false;finish=null;keys.clear();overlay('');$('hud').hidden=false;$('controls').hidden=false;$('pause').hidden=false;$('pause').textContent='Pause';$('left').hidden=$('right').hidden=m==='free';$('action').hidden=m!=='free';$('action').textContent='Richtung stoppen';}
function result(title,description,won=false){if(endShown)return;endShown=true;tone(won);$('controls').hidden=true;$('pause').hidden=true;overlay(`<div class="card"><div class="medal">${won?'🏆':'⚽'}</div><h2>${title}</h2><p>${description}</p><div class="result-score">${model.score}</div><div class="eyebrow">PUNKTE</div><button class="primary" data-start="${mode}">Noch eine Runde →</button><button data-home>Hauptmenü</button></div>`);}
function pause(){if(!model||endShown)return;paused=!paused;keys.clear();$('pause').textContent=paused?'Weiter':'Pause';if(paused){overlay('<div class="card"><div class="eyebrow">KURZ DURCHATMEN</div><h2>Spiel pausiert</h2><button class="primary" data-resume>Weiterspielen</button><button data-home>Hauptmenü</button></div>');}else if(finish&&!finish.shot)sequenceUI();else overlay('');}
function sequenceUI(){const symbols=['←','↑','→','↓'];overlay(`<div class="card"><div class="eyebrow">DER ENTSCHEIDENDE ABSCHLUSS</div><h2>Dein Tor-Moment!</h2><p>Tippe die goldenen Pfeile von links nach rechts.<br><b id="countdown"></b></p><div class="sequence">${finish.seq.map((n,i)=>`<button data-seq="${i}" class="${i<finish.index?'done':i===finish.index?'primary':''}" aria-label="Symbol ${i+1}">${symbols[n]}</button>`).join('')}</div><div class="tip">PC: passende Pfeiltasten verwenden</div></div>`);}
function beginFinish(){finish={seq:Array.from({length:4},()=>Math.floor(Math.random()*4)),index:0,time:8,shot:0,success:false};sequenceUI();}
function seqTap(index){if(paused||!finish||finish.shot)return;if(index!==finish.index){finish.time=Math.max(0,finish.time-1);tone(false);return;}finish.index++;tone();if(finish.index===4){finish.success=true;finish.shot=.001;overlay('');}else sequenceUI();}
function move(d){if(paused||endShown||finish)return;if(mode==='dribble')model.move(d);}

$('overlay').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode)intro(b.dataset.mode);else if(b.dataset.start)start(b.dataset.start);else if(b.hasAttribute('data-home'))menu();else if(b.hasAttribute('data-resume'))pause();else if(b.dataset.seq!==undefined)seqTap(Number(b.dataset.seq));});

let previousScore=0;
